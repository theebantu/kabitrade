<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KabiTrade - Reset Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>🛍️ KabiTrade</h1>
        <p>Reset Your Password</p>
      </div>

      <!-- Forgot Password Form -->
      <form id="forgotPasswordForm" class="auth-form active">
        <h2>Forgot Password</h2>
        <p>Enter your email and we'll help you reset your password.</p>
        <input type="email" id="forgotEmail" placeholder="Your Email" required>
        <button type="submit" class="btn-primary">Reset Password</button>
        <p class="auth-toggle">
          <a href="login.html">Back to Login</a>
        </p>
      </form>

      <!-- Reset Password Form -->
      <form id="resetPasswordForm" class="auth-form" style="display:none;">
        <h2>Set New Password</h2>
        <input type="email" id="resetEmail" placeholder="Your Email" required>
        <input type="password" id="newPassword" placeholder="New Password" required>
        <input type="password" id="confirmNewPassword" placeholder="Confirm Password" required>
        <button type="submit" class="btn-primary">Reset Password</button>
      </form>

      <div id="recoveryMessage" class="message"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
